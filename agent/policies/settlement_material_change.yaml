id: settlement_material_change
version: "1.0"
name: 活动重大变更规则
description: 判断组织者对活动的变更是否构成重大变更，影响爽约判定

# 重大变更定义
material_change_criteria:
  location:
    - 地点直线距离变更超过 5 公里
    - 从公共交通可达变为需要自驾
    - 从室内变为室外（或反之）且影响活动可行性
  time:
    - 活动开始时间变更超过 2 小时
    - 从周末变为工作日（或反之）
  cost:
    - 费用增加超过原金额的 50%
    - 从免费变为付费
  notice:
    - 变更通知距活动开始不足 2 小时为"紧急变更"
    - 变更通知距活动开始不足 24 小时为"临时变更"

# 对爽约判定的影响
impact_on_no_show:
  - 紧急重大变更 + 通知未送达 = 参与者不构成爽约
  - 紧急重大变更 + 通知已送达 + 参与者确认收到 = 仍可能构成爽约
  - 临时重大变更 + 参与者明确表示无法到达新地点 = 不构成爽约
  - 非重大变更（如活动描述微调）= 不影响爽约判定

# 证据标准
evidence_standard:
  required:
    - post.updated 事件（含旧值/新值）
    - 变更时间与活动开始时间的差值
  strongly_recommended:
    - 通知送达状态
    - 参与者对变更的回复
  supporting:
    - 参与者当时所在位置（如聊天提到"我已经到原地点了"）

# 举证责任
burden_of_proof:
  - 组织者声称参与者爽约时，如存在变更事件，组织者需证明通知已送达
  - 参与者声称因变更无法参加时，需证明变更构成重大变更
